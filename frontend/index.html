<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jailbreak Attack Demonstration Platform</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Authorized Red-Team Lab</p>
          <h1>越狱攻击演示平台</h1>
          <p class="hero-copy">
            统一管理攻击方法、数据集和实验记录。当前已接入 TAP，可通过本地或 OpenAI 兼容模型服务执行黑盒红队测试。
          </p>
        </div>
        <div class="hero-card">
          <span class="signal-dot" id="healthDot"></span>
          <strong id="healthTitle">检查环境中</strong>
          <p id="healthText">正在读取后端、TAP 和依赖状态。</p>
        </div>
      </header>

      <main class="grid">
        <section class="panel config-panel">
          <div class="section-heading">
            <span>01</span>
            <h2>运行配置</h2>
          </div>

          <div class="notice">
            本平台只做实验编排；模型密钥不会写入任务元数据。若不在页面填写 token，将使用后端进程已有环境变量。
          </div>

          <div class="form-grid">
            <label>
              攻击方法
              <select id="method">
                <option value="tap">TAP</option>
              </select>
            </label>
            <label>
              攻击者模型
              <select id="attackModel"></select>
            </label>
            <label>
              目标模型
              <select id="targetModel"></select>
            </label>
            <label>
              评估模型
              <select id="evaluatorModel"></select>
            </label>
          </div>

          <details class="settings" open>
            <summary>OpenAI 兼容自部署模型</summary>
            <div class="form-grid">
              <label>
                CUSTOM_API_URL
                <input id="customApiUrl" type="url" placeholder="https://your-host/v1" />
              </label>
              <label>
                CUSTOM_MODEL_NAME
                <input id="customModelName" type="text" placeholder="your-model-name" />
              </label>
              <label class="wide">
                CUSTOM_API_TOKEN
                <input id="customApiToken" type="password" placeholder="留空则使用后端环境变量" />
              </label>
            </div>
          </details>

          <div class="prompt-grid">
            <label>
              攻击目标 goal
              <textarea id="goal" rows="5" placeholder="输入本次授权红队测试的目标行为"></textarea>
            </label>
            <label>
              期望响应前缀 target_str
              <textarea id="targetStr" rows="5" placeholder="输入评估者用于判断成功的响应前缀"></textarea>
            </label>
          </div>

          <details class="settings">
            <summary>TAP 参数</summary>
            <div class="number-grid">
              <label>Depth <input id="depth" type="number" min="1" max="20" value="1" /></label>
              <label>Width <input id="width" type="number" min="1" max="50" value="1" /></label>
              <label>Branching <input id="branchingFactor" type="number" min="1" max="20" value="1" /></label>
              <label>Streams <input id="nStreams" type="number" min="1" max="50" value="1" /></label>
              <label>Keep last <input id="keepLastN" type="number" min="1" max="20" value="3" /></label>
              <label>Attack tokens <input id="attackMaxTokens" type="number" min="16" max="4096" value="500" /></label>
              <label>Target tokens <input id="targetMaxTokens" type="number" min="16" max="4096" value="150" /></label>
              <label>Eval tokens <input id="evaluatorMaxTokens" type="number" min="1" max="512" value="10" /></label>
              <label>Eval temp <input id="evaluatorTemp" type="number" min="0" max="2" step="0.1" value="0" /></label>
              <label>Attempts <input id="maxAttackAttempts" type="number" min="1" max="20" value="5" /></label>
              <label>Category <input id="category" type="text" value="manual" /></label>
              <label>Index <input id="index" type="number" value="0" /></label>
            </div>
          </details>

          <div class="actions">
            <button class="primary" id="startBtn">启动 TAP 测试</button>
            <button class="ghost" id="cancelBtn" disabled>取消当前任务</button>
          </div>
        </section>

        <section class="panel dataset-panel">
          <div class="section-heading">
            <span>02</span>
            <h2>数据集</h2>
          </div>

          <form id="uploadForm" class="upload-box">
            <input id="datasetFile" type="file" accept=".csv,.jsonl,.json,.txt" />
            <button type="submit">上传数据集</button>
          </form>

          <label>
            已上传数据集
            <select id="datasetSelect">
              <option value="">手动输入，不使用数据集</option>
            </select>
          </label>

          <div class="dataset-meta" id="datasetMeta">选择数据集后会显示字段和样例。</div>
          <div class="rows" id="datasetRows"></div>
        </section>

        <section class="panel monitor-panel">
          <div class="section-heading">
            <span>03</span>
            <h2>运行监控</h2>
          </div>

          <div class="job-strip">
            <div>
              <small>当前任务</small>
              <strong id="currentJob">未启动</strong>
            </div>
            <span id="jobStatus" class="status idle">idle</span>
          </div>

          <pre id="logBox" class="log-box">等待运行日志...</pre>
        </section>

        <section class="panel results-panel">
          <div class="section-heading">
            <span>04</span>
            <h2>结果</h2>
          </div>
          <div id="resultSummary" class="result-summary empty">暂无结果。</div>
          <div id="resultRows" class="result-rows"></div>
        </section>

        <section class="panel jobs-panel">
          <div class="section-heading">
            <span>05</span>
            <h2>历史任务</h2>
          </div>
          <div id="jobsList" class="jobs-list"></div>
        </section>

        <section class="panel health-panel">
          <div class="section-heading">
            <span>06</span>
            <h2>环境检查</h2>
          </div>
          <div id="healthGrid" class="health-grid"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <script src="/assets/app.js"></script>
  </body>
</html>
